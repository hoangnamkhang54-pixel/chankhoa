name: Build & Release .deb

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-deb:
    name: Build for arm64/arm64e
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build
        working-directory: NoScreenLock
        run: |
          export ARCHS="arm64 arm64e"
          export TARGET_IPHONEOS_DEPLOYMENT_VERSION=15.0
          rm -f Makefile Makeflie makefile GNUmakefile
          printf '%s\n' \
            'export ARCHS = arm64 arm64e' \
            'export TARGET = iphone:clang:latest:15.0' \
            '' \
            'include $(THEOS)/makefiles/common.mk' \
            '' \
            'TWEAK_NAME = NoScreenLock' \
            'NoScreenLock_FILES = Tweak.xm' \
            'NoScreenLock_FRAMEWORKS = UIKit CoreGraphics' \
            'NoScreenLock_CFLAGS = -fobjc-arc' \
            '' \
            'include $(THEOS_MAKE_PATH)/tweak.mk' > Makefile
          make clean package FINALPACKAGE=1
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp packages/*.deb "$GITHUB_WORKSPACE/out/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: out/*.deb
          if-no-files-found: error

      - name: Set release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release & Upload .deb
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.name }}
          artifacts: "out/*.deb"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
