name: Build & Release .deb

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trực tiếp trên tab Actions của GitHub

jobs:
  build-deb:
    name: Build for arm64/arm64e
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Cấp quyền ghi Release cho GITHUB_TOKEN

    steps:
      - name: Checkout code  
        uses: actions/checkout@v3
        
      - name: Setup Theos Environment  
        run: |
          sudo apt-get update -y && sudo apt-get install -y \
            git wget curl bsdmainutils autoconf automake libtool \
            build-essential clang libffi-dev libssl-dev zlib1g-dev \
            flex bison libxml2-dev libcurl4-openssl-dev cmake pkg-config
      
          # Clone Theos
          git clone --recursive https://github.com/theos/theos ~/theos
      
          # Clone trực tiếp kho SDKs của Theos (tránh lỗi 404 khi dùng wget zip)
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          
      - name: Export env và build  
        run: |
          export THEOS=~/theos  
          export ARCHS="arm64 arm64e"  
          export TARGET_IPHONEOS_DEPLOYMENT_VERSION=15.0  

          chmod +x package.sh  
          ./package.sh
        
      - name: Kiểm tra thư mục chứa file .deb
        run: |
          echo "Danh sách file tại thư mục gốc:"
          ls -la
          echo "Danh sách file trong thư mục packages (nếu có):"
          ls -la packages/ || true

      - name: Create Release & Upload .deb  
        uses: ncipollo/release-action@v1  
        with:
          artifacts: "packages/*.deb" # Mặc định Theos xuất file vào thư mục packages/
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
